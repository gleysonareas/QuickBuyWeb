<header>
  <nav
    class="navbar navbar-expand-sm navbar-toggleable-sm navbar-light bg-white border-bottom box-shadow mb-3"
  >
    <div class="container">
      <a class="navbar-brand" [routerLink]="['/']">QuickBuy</a>
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target=".navbar-collapse"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isExpanded"
        (click)="toggle()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div
        class="navbar-collapse collapse d-sm-inline-flex flex-sm-row-reverse"
        [ngClass]="{ show: isExpanded }"
      >
        <ul class="navbar-nav flex-grow">
          <li
            class="nav-item"
            [routerLinkActive]="['link-active']"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <a class="nav-link text-dark" [routerLink]="['/']">Home</a>
          </li>
          <!-- <li class="nav-item" [routerLinkActive]="['link-active']">
            <a class="nav-link text-dark" [routerLink]="['/pages/counter']"
              >Counter</a
            >
          </li>
          <li class="nav-item" [routerLinkActive]="['link-active']">
            <a class="nav-link text-dark" [routerLink]="['/pages/fetch-data']"
              >Fetch data</a
            >
          </li> -->
          <li
            class="nav-item"
            [routerLinkActive]="['link-active']"
            *ngIf="userIsAdmin()"
          >
            <a
              class="nav-link text-dark"
              [routerLink]="['/pages/search-product']"
              >Product</a
            >
          </li>
          <li
            class="nav-item"
            [routerLinkActive]="['link-active']"
            *ngIf="!userIsLogged()"
          >
            <a class="nav-link text-dark" [routerLink]="['/auth/login']"
              >Login</a
            >
          </li>
          <!-- <li class="nav-item" [routerLinkActive]="['link-active']" *ngIf="userIsLogged()">
            <a class="nav-link text-dark" [routerLink]="['/exit']" (click)="exit()"
              >Sair</a
            >
          </li> -->
          <li
            class="nav-item dropdown"
            [routerLinkActive]="['link-active']"
            *ngIf="userIsLogged()"
          >
            <a
              href="#"
              class="nav-link text-dark dropdown-toggle"
              role="button"
              aria-haspopup="true"
              aria-expanded="false"
              id="linkMenu"
              data-toggle="dropdown"
            >
              {{ user.name }}
            </a>
            <ul class="dropdown-menu" aria-labelledby="linkMenu">
              <li
                class="dropdown-item"
                role="menu"
                [routerLink]="['/exit']"
                (click)="exit()"
              >
                Sair
              </li>
            </ul>
          </li>
          <li
            class="nav-item"
            [routerLinkActive]="['link-active']"
            *ngIf="verifyShoppingCart()"
          >
            <a
              class="nav-link text-dark"
              [routerLink]="['/pages/efetivar-compra']"
            >
              <img
                src="../../../../assets/shopping-cart-icon.png"
                alt=""
                style="width: 20px; height: 20px"
              />
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
