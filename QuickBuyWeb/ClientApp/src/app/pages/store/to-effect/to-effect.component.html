<div class="container">
  <div class="row">
    <div class="col-md-8">
      <table class="table table-bordered table-striped table-hover">
        <thead>
          <tr>
            <th></th>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of products">
            <td style="width: 20%">
              <img
                src="../../../../../../files/{{ item.nameFile }}"
                alt=""
                width="100%"
              />
            </td>
            <td style="width: 40%">{{ item.description }}</td>
            <td style="width: 5%">
              <input
                type="number"
                class="form-control"
                value="1"
                (change)="updatePrice(item, $event.target.value)"
                [(ngModel)]="item.quantity"
                style="width: 50px"
              />
            </td>
            <td style="width: 10%">
              {{ item.price | currency : "BRL" : true : "1.0-2" }}
            </td>
            <td style="width: 10%">
              <button
                class="btn btn-secondary btn-sm"
                (click)="removeItem(item)"
              >
                Remover
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="col-md-4">
      <div class="row">
        <div class="card">
          <div class="card-header">Resumo</div>
          <div class="card-body">
            <table class="mb-4">
              <tr>
                <td>Total:</td>
                <td>{{ setTotal() | currency : "BRL" : true : "1.0-2" }}</td>
              </tr>
            </table>
            <button class="btn btn-danger" (click)="effectBuy()">Efetivar Compra</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
