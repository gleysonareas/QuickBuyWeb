<h1 class="h4 title">Cadastro de Produto</h1>
<label for="nameProduct" class="sr-only">Nome</label>
<input
  type="text"
  id="nameProduct"
  name="nameProduct"
  placeholder="Nome do Produto"
  class="form-control mb-2 col-md-6"
  [ngClass]="{
    'is-invalid': name.invalid && (name.dirty || name.touched),
    'is-valid': name.valid && (name.dirty || name.touched)
  }"
  [(ngModel)]="product.name"
  #name="ngModel"
  required
/>

<div
  class="invalid-feedback mb-2"
  *ngIf="name.invalid && (name.dirty || name.touched)"
>
  <div *ngIf="name.errors.required">
    Nome do produto é de preechimento obrigatório
  </div>
</div>

<label for="descriptionProduct" class="sr-only">Descrição</label>
<input
  type="text"
  id="descriptionProduct"
  name="descriptionProduct"
  placeholder="Descrição do Produto"
  class="form-control mb-2 col-md-6"
  [ngClass]="{
    'is-invalid':
      description.invalid && (description.dirty || description.touched),
    'is-valid': description.valid && (description.dirty || description.touched)
  }"
  [(ngModel)]="product.description"
  #description="ngModel"
  required
/>

<div
  class="invalid-feedback mb-2"
  *ngIf="description.invalid && (description.dirty || description.touched)"
>
  <div *ngIf="description.errors.required">
    Descrição do produto é de preechimento obrigatório
  </div>
</div>

<label for="priceProduct" class="sr-only">Descrição</label>
<input
  type="number"
  id="priceProduct"
  name="priceProduct"
  placeholder="Preço do Produto"
  class="form-control mb-2 col-md-3"
  [ngClass]="{
    'is-invalid': price.invalid && (price.dirty || price.touched),
    'is-valid': price.valid && (price.dirty || price.touched)
  }"
  [(ngModel)]="product.price"
  #price="ngModel"
  required
/>

<div
  class="invalid-feedback mb-2"
  *ngIf="price.invalid && (price.dirty || price.touched)"
>
  <div *ngIf="price.errors.required">
    Preço do produto é de preechimento obrigatório
  </div>
</div>

<div class="input-group mb-2">
  <div class="custom-file col-md-4">
    <input
      type="file"
      class="custom-file-input"
      id="inputFile"
      (change)="inputChange($event.target.files)"
    />
    <label class="custom-file-label" for="inputFile">Selecione uma Foto</label>
  </div>
</div>
<div class="d-flex">
  <button
    class="btn btn-primary mb-2 mr-2"
    (click)="addProduct()"
    [disabled]="activateSpinner"
  >
    <span
      class="spinner-border spinner-border-sm"
      *ngIf="activateSpinner"
    ></span>
    Cadastrar
  </button>
  <button class="btn btn-secondary mb-2" (click)="cancel()">Cancelar</button>
</div>

<div class="alert alert-danger col-md-4" *ngIf="message">{{ message }}</div>
